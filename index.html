<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b4a"><meta name="description" content="Pesan makanan kantin kampus Pacil's Food sebelum istirahat.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Pacil’s Food</title>
<style>
:root{--ink:#172b25;--green:#176b4a;--lime:#d7f36a;--paper:#f5f1e8;--card:#fffdf8;--muted:#77827a;--line:#e6e4d9;--orange:#f28a54}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1160px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px}.logo{display:grid;place-items:center;width:40px;height:40px;background:var(--lime);border-radius:14px;font-size:22px}.top button,.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:750}.ghost{background:#fff;color:var(--ink)}.primary{background:var(--green);color:white}.accent{background:var(--lime);color:var(--ink)}.hero{margin:24px 0 22px;padding:36px;border-radius:26px;background:var(--green);color:white;position:relative;overflow:hidden}.hero:after{content:'🥗';position:absolute;right:38px;top:8px;font-size:110px;opacity:.92;transform:rotate(-12deg)}.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lime);font-weight:800}.hero h1{font-size:clamp(32px,6vw,54px);line-height:1.05;max-width:620px;margin:10px 0}.hero p{max-width:520px;color:#d4e5dc;margin:12px 0 20px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{padding:10px 16px;border:1px solid var(--line);background:transparent;border-radius:99px;color:var(--muted);font-weight:750}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 14px}.section-head h2{margin:0;font-size:24px}.muted{color:var(--muted)}.shops{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.shop{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;display:flex;gap:13px;align-items:center;cursor:pointer;transition:.15s}.shop:hover{transform:translateY(-2px);border-color:#a9c7b5}.shop-icon{width:56px;height:56px;display:grid;place-items:center;background:#eef1df;border-radius:16px;font-size:28px}.shop h3{margin:0 0 3px}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#edf6e4;color:var(--green);font-size:12px;font-weight:750}.grid{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.food{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.food img,.food .placeholder{height:145px;width:100%;object-fit:cover;background:#eae8dc;display:grid;place-items:center;font-size:54px}.food-body{padding:14px}.food h3{margin:0 0 5px}.price{font-weight:850;color:var(--green);font-size:17px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.food button{padding:8px 12px;border-radius:10px;border:0;background:var(--lime);font-weight:800}.panel,.formbox,.order{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.panel{position:sticky;top:12px}.panel h3,.formbox h3{margin:0 0 12px}.cartline{padding:10px 0;border-bottom:1px solid var(--line)}.cartline small{color:var(--muted)}.quantity{display:flex;align-items:center;gap:8px}.quantity button{width:26px;height:26px;border:0;border-radius:8px;background:#eef1df;font-weight:900}.total{font-size:20px;font-weight:850;margin:16px 0}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:750}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}.field textarea{min-height:68px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seller-layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}.orders{display:grid;gap:10px}.order h3{margin:0}.order p{margin:7px 0}.badge{padding:4px 9px;border-radius:99px;background:#f2ead4;font-size:12px;font-weight:800}.empty{background:var(--card);border:1px dashed #c9cbbd;padding:26px;border-radius:16px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;border-radius:12px;box-shadow:0 8px 28px #0002;z-index:5}.modal-bg{position:fixed;inset:0;background:#10241dcc;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:var(--card);padding:24px;border-radius:22px;max-width:440px;width:100%}.modal h2{margin:4px 0}.foot{text-align:center;padding:32px 0 12px;color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:760px){.wrap{padding:16px}.hero{padding:25px}.hero:after{right:5px;font-size:76px;opacity:.42}.grid,.seller-layout{grid-template-columns:1fr}.panel{position:static;order:2}.section-head{align-items:start;flex-direction:column}.formrow{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brand"><span class="logo">🍽️</span>Pacil’s Food</div><div style="display:flex;gap:8px"><button class="ghost hidden" id="installBtn" onclick="installApp()">⬇ Pasang aplikasi</button><button class="ghost" id="modeBtn" onclick="chooseMode()">Mulai pesan →</button></div></header>
<section class="hero"><div class="eyebrow">Kantin kampus, tanpa antre lama</div><h1>Makan enak.<br>Waktu istirahat tetap lega.</h1><p>Pesan lebih awal, pilih menu favoritmu, lalu ambil saat sudah siap. Praktis buat mahasiswa, mudah buat penjual.</p><button class="btn accent" onclick="chooseMode()">Mulai sekarang ↗</button></section>
<nav class="tabs"><button class="tab active" id="buyerTab" onclick="setMode('buyer')">🛍️ Pembeli</button><button class="tab" id="sellerTab" onclick="setMode('seller')">🥘 Penjual</button><button class="tab" id="ordersTab" onclick="setMode('myorders')">📦 Pesanan saya <span id="myCount"></span></button></nav>
<main id="app"></main><footer class="foot">Pacil’s Food · Pesan dulu, ambil saat siap ✨</footer></div><div id="overlay"></div><div id="toasts"></div>
<script>
const KEY='pacils-food-v1',money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{shops:[{id:'s1',name:'Warung Bu Sari',category:'Masakan rumahan',emoji:'🍛',promo:'Paket hemat tersedia',items:[{id:'i1',name:'Nasi Pecel',price:12000,desc:'Sayur segar, bumbu kacang',emoji:'🥗'},{id:'i2',name:'Ayam Geprek',price:16000,desc:'Level pedas bisa dipilih',emoji:'🍗'},{id:'i3',name:'Teh Manis',price:5000,desc:'Dingin dan menyegarkan',emoji:'🧋'}]},{id:'s2',name:'Kopi Sudut',category:'Minuman & camilan',emoji:'☕',promo:'Teman belajar sampai sore',items:[{id:'i4',name:'Es Kopi Susu',price:14000,desc:'Kopi, susu, gula aren',emoji:'🧋'},{id:'i5',name:'Roti Bakar',price:10000,desc:'Cokelat keju',emoji:'🍞'}]}],orders:[]};
let mode='buyer',selected=null,cart={},myName=localStorage.getItem('pf-name')||'',timer;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
function toast(t){let x=document.getElementById('toasts');x.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>x.innerHTML='',2400)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shop(id){return db.shops.find(x=>x.id===id)}function chooseMode(){setMode(mode==='seller'?'buyer':'buyer');document.getElementById('app').scrollIntoView({behavior:'smooth'})}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(m==='buyer'?'buyerTab':m==='seller'?'sellerTab':'ordersTab').classList.add('active');document.getElementById('modeBtn').textContent=m==='seller'?'Lihat sebagai pembeli →':'Mode penjual →';render()}
function render(){let a=document.getElementById('app');document.getElementById('myCount').textContent=db.orders.filter(o=>o.buyer===myName&&o.status!=='Siap diambil').length||'';if(mode==='seller')return renderSeller(a);if(mode==='myorders')return renderOrders(a);renderBuyer(a)}
function renderBuyer(a){if(!selected){a.innerHTML=`<div class="section-head"><div><h2>Pilih warung favorit</h2><div class="muted">Pilih toko untuk melihat menu dan pesan.</div></div></div><div class="shops">${db.shops.map(s=>`<article class="shop" onclick="openShop('${s.id}')"><div class="shop-icon">${esc(s.emoji||'🍽️')}</div><div><h3>${esc(s.name)}</h3><div class="muted">${esc(s.category||'Kantin kampus')}</div><span class="pill">${esc(s.promo||'Buka sekarang')}</span></div><b style="margin-left:auto">→</b></article>`).join('')||'<div class="empty">Belum ada warung. Penjual bisa membuat toko pertama.</div>'}</div>`;return}let s=shop(selected);if(!s){selected=null;return render()}let count=Object.values(cart).reduce((x,n)=>x+n,0),total=s.items.reduce((x,i)=>x+i.price*(cart[i.id]||0),0);a.innerHTML=`<div class="section-head"><div><button class="tab" onclick="selected=null;cart={};render()">← Semua warung</button><h2 style="margin-top:12px">${esc(s.emoji||'🍽️')} ${esc(s.name)}</h2><div class="muted">${esc(s.category||'Kantin kampus')} · ${esc(s.promo||'Pesan sekarang, ambil saat siap')}</div></div></div><div class="grid"><div class="menu">${s.items.map(i=>`<article class="food">${i.photo?`<img src="${esc(i.photo)}" alt="${esc(i.name)}">`:`<div class="placeholder">${esc(i.emoji||'🍜')}</div>`}<div class="food-body"><div class="row"><h3>${esc(i.name)}</h3><span class="price">${money(i.price)}</span></div><p class="muted">${esc(i.desc||'Dibuat segar untukmu')}</p><div class="row"><span class="pill">Siap dipesan</span><button onclick="add('${i.id}')">+ Tambah</button></div></div></article>`).join('')||'<div class="empty">Menu belum tersedia.</div>'}</div><aside class="panel"><h3>🧺 Keranjang <span class="muted">(${count})</span></h3>${s.items.filter(i=>cart[i.id]).map(i=>`<div class="cartline"><div class="row"><b>${esc(i.name)}</b><span>${money(i.price*cart[i.id])}</span></div><div class="row"><small>${money(i.price)} / item</small><div class="quantity"><button onclick="qty('${i.id}',-1)">−</button>${cart[i.id]}<button onclick="qty('${i.id}',1)">+</button></div></div></div>`).join('')||'<p class="muted">Tambahkan menu untuk mulai pesan.</p>'}<div class="total row"><span>Total</span><span>${money(total)}</span></div><button class="btn primary" style="width:100%" onclick="checkout()" ${count?'':'disabled'}>Pesan sekarang →</button><p class="muted" style="font-size:12px">Pembayaran dilakukan saat mengambil pesanan.</p></aside></div>`}
function openShop(id){selected=id;cart={};render()}function add(id){cart[id]=(cart[id]||0)+1;render();toast('Ditambahkan ke keranjang')}function qty(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];render()}
function checkout(){if(!Object.keys(cart).length)return;document.getElementById('overlay').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="eyebrow" style="color:var(--green)">Hampir selesai</div><h2>Siapa yang pesan?</h2><p class="muted">Pesanan diteruskan ke ${esc(shop(selected).name)}.</p><div class="field"><label>Nama pemesan</label><input id="buyerName" maxlength="40" value="${esc(myName)}" placeholder="Contoh: Rani" autofocus></div><div class="field"><label>Catatan untuk penjual (opsional)</label><textarea id="note" maxlength="160" placeholder="Contoh: sambal dipisah, teh tanpa es"></textarea></div><button class="btn primary" style="width:100%" onclick="placeOrder()">Kirim pesanan · ${money(shop(selected).items.reduce((t,i)=>t+i.price*(cart[i.id]||0),0))}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Kembali</button></div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}function placeOrder(){let name=document.getElementById('buyerName').value.trim();if(!name){toast('Isi nama pemesan dulu');return}myName=name;localStorage.setItem('pf-name',name);let s=shop(selected),items=s.items.filter(i=>cart[i.id]).map(i=>({name:i.name,qty:cart[i.id],price:i.price})),total=items.reduce((a,i)=>a+i.qty*i.price,0);db.orders.unshift({id:'P'+Date.now().toString().slice(-7),shopId:s.id,shop:s.name,buyer:name,note:document.getElementById('note').value.trim(),items,total,status:'Pesanan baru',time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});save();closeModal();selected=null;cart={};setMode('myorders');toast('Pesanan terkirim ke penjual!')}
function renderOrders(a){let list=db.orders.filter(o=>!myName||o.buyer===myName);a.innerHTML=`<div class="section-head"><div><h2>Status pesananmu</h2><div class="muted">Lihat pembaruan dari penjual secara langsung di perangkat ini.</div></div></div>${list.length?`<div class="orders">${list.map(o=>`<article class="order"><div class="row"><div><h3>${esc(o.shop)}</h3><small class="muted">${esc(o.id)} · ${esc(o.time)}</small></div><span class="badge">${esc(o.status)}</span></div><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</p>${o.note?`<small class="muted">Catatan: ${esc(o.note)}</small>`:''}<div class="row" style="margin-top:10px"><span class="muted">${o.status==='Siap diambil'?'Silakan ambil di warung!':'Kami kabari saat siap.'}</span><b>${money(o.total)}</b></div></article>`).join('')}</div>`:'<div class="empty">Belum ada pesanan. Pilih warung dan pesan menu favoritmu 🥗</div>'}`}
function renderSeller(a){a.innerHTML=`<div class="section-head"><div><h2>Ruang penjual</h2><div class="muted">Kelola toko, menu, promo, dan pesanan masuk.</div></div></div><div class="seller-layout"><form class="formbox" onsubmit="saveShop(event)"><h3>🏪 Profil toko</h3><div class="field"><label>Nama toko</label><input id="sn" maxlength="50" placeholder="Contoh: Warung Bu Sari" required></div><div class="field"><label>Jenis / kategori</label><input id="sc" maxlength="50" placeholder="Masakan rumahan"></div><div class="field"><label>Promo atau info toko</label><input id="sp" maxlength="70" placeholder="Paket hemat hari ini"></div><div class="field"><label>Ikon toko (emoji)</label><input id="se" maxlength="4" value="🍛"></div><button class="btn primary" style="width:100%">Buat toko</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>➕ Tambah menu</h3><div class="field"><label>Pilih toko</label><select id="si">${db.shops.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Nama makanan / minuman</label><input id="iname" maxlength="50" placeholder="Es teh manis" required></div><div class="formrow"><div class="field"><label>Harga (Rp)</label><input id="iprice" type="number" min="1" max="10000000" placeholder="5000" required></div><div class="field"><label>Ikon</label><input id="iemoji" maxlength="4" value="🍜"></div></div><div class="field"><label>Deskripsi singkat</label><input id="idesc" maxlength="90" placeholder="Segar, manis, dingin"></div><div class="field"><label>Foto menu (opsional)</label><input id="iphoto" type="file" accept="image/*"></div><button class="btn accent" style="width:100%">Simpan menu</button><p class="muted" style="font-size:12px">Foto disimpan di browser ini. Gunakan gambar kecil agar ruang penyimpanan tidak cepat penuh.</p></form><section><h3 style="margin-top:0">🔔 Pesanan masuk <span class="pill">${db.orders.filter(o=>o.status!=='Siap diambil').length}</span></h3><div class="orders">${db.orders.length?db.orders.map(o=>`<article class="order"><div class="row"><div><h3>${esc(o.buyer)} <small class="muted">· ${esc(o.time)}</small></h3><small class="muted">${esc(o.id)} · ${esc(o.shop)}</small></div><span class="badge">${esc(o.status)}</span></div><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</p>${o.note?`<small class="muted">Catatan: ${esc(o.note)}</small>`:''}<div class="row" style="margin-top:12px"><b>${money(o.total)}</b><select onchange="status('${o.id}',this.value)">${['Pesanan baru','Sedang disiapkan','Siap diambil'].map(st=>`<option ${o.status===st?'selected':''}>${st}</option>`).join('')}</select></div></article>`).join(''):'<div class="empty">Belum ada pesanan masuk. Pesanan pembeli akan muncul di sini.</div>'}</div><h3 style="margin-top:24px">Menu toko</h3><div class="orders">${db.shops.map(s=>`<article class="order"><div class="row"><div><h3>${esc(s.emoji||'🍽️')} ${esc(s.name)}</h3><small class="muted">${esc(s.category||'Kantin kampus')} · ${s.items.length} menu</small></div><button class="tab" onclick="deleteShop('${s.id}')">Hapus toko</button></div><p>${s.items.map(i=>`${esc(i.name)} (${money(i.price)})`).join(' · ')||'Belum ada menu'}</p></article>`).join('')}</div></section></div>`}
function saveShop(e){e.preventDefault();let s={id:'s'+Date.now(),name:document.getElementById('sn').value.trim(),category:document.getElementById('sc').value.trim()||'Kantin kampus',promo:document.getElementById('sp').value.trim()||'Pesan sekarang',emoji:document.getElementById('se').value.trim()||'🍽️',items:[]};db.shops.push(s);save();render();toast('Toko berhasil dibuat!')}
function saveItem(e){e.preventDefault()}document.addEventListener('submit',async e=>{if(e.target.id!=='itemform')return});
async function addMenu(e){e.preventDefault()}
function status(id,v){let o=db.orders.find(x=>x.id===id);if(o){o.status=v;save();render();toast('Status pesanan diperbarui')}}function deleteShop(id){if(!confirm('Hapus toko ini beserta menunya?'))return;db.shops=db.shops.filter(s=>s.id!==id);save();render();toast('Toko dihapus')}
// Menu form is handled here to keep the prototype in one file.
document.addEventListener('click',()=>{});
function submitMenu(e){e.preventDefault()}
// Attach menu creation after each seller render.
const originalRenderSeller=renderSeller;
renderSeller=function(a){originalRenderSeller(a);let f=a.querySelector('.formbox');f.addEventListener('submit',async ev=>{if(!ev.submitter||ev.submitter.textContent.includes('Buat toko'))return;ev.preventDefault();let file=document.getElementById('iphoto').files[0],photo='';if(file){if(file.size>1500000){toast('Ukuran foto maksimal 1.5 MB');return}photo=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}let s=shop(document.getElementById('si').value);if(!s){toast('Buat toko terlebih dahulu');return}s.items.push({id:'i'+Date.now(),name:document.getElementById('iname').value.trim(),price:+document.getElementById('iprice').value,emoji:document.getElementById('iemoji').value.trim()||'🍜',desc:document.getElementById('idesc').value.trim(),photo});try{save()}catch{ s.items.pop();toast('Penyimpanan penuh. Coba foto yang lebih kecil.');return }render();toast('Menu ditambahkan!')})}
window.addEventListener('storage',e=>{if(e.key===KEY){db=JSON.parse(e.newValue||'{}');render()}});render();
let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').classList.remove('hidden')});async function installApp(){if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').classList.add('hidden')}window.addEventListener('appinstalled',()=>document.getElementById('installBtn').classList.add('hidden'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
</script></body></html>
