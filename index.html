<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#623d2b"><meta name="description" content="Pacil Food — pesan makanan kantin kampus sebelum istirahat.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Pacil Food — Kantin Kampus</title>
  <style>
    :root{--brown:#623d2b;--dark:#2c211b;--cream:#fffaf1;--paper:#f5eee2;--gold:#e7b75d;--green:#466447;--muted:#81766d;--line:#e9dfd2;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--dark);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:18px 24px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px;color:var(--brown);font-size:20px;font-weight:900}.brand img{width:48px;height:48px;border-radius:15px;object-fit:cover;border:2px solid #fff;box-shadow:0 3px 12px #40251322}.brand small{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700;text-transform:uppercase}.actions{display:flex;align-items:center;gap:8px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.primary{background:var(--brown);color:white}.light{background:white;color:var(--brown);border:1px solid var(--line)}.gold{background:var(--gold);color:var(--dark)}.profile-chip{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;background:white;border:1px solid var(--line);border-radius:99px;font-weight:750}.profile-chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--paper)}.hero{margin:20px 0 18px;min-height:300px;position:relative;overflow:hidden;border-radius:24px;background:var(--brown);color:white;display:flex;align-items:end}.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#25160de8 0%,#352014b0 45%,#27180a22 100%)}.hero-copy{position:relative;z-index:1;padding:30px;max-width:600px}.eyebrow{color:#ffde9e;text-transform:uppercase;font-size:12px;font-weight:850;letter-spacing:1.6px}.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.04;margin:9px 0}.hero p{color:#fff4e6;max-width:460px;margin:0 0 17px}.nav{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--cream);color:var(--muted);border-radius:99px;padding:9px 15px;font-weight:800}.nav button.active{background:var(--brown);border-color:var(--brown);color:white}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 0 12px}.head h2{margin:0;font-size:24px}.muted{color:var(--muted)}.shops,.foods,.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.shop,.food,.order,.panel{background:var(--cream);border:1px solid var(--line);border-radius:17px;overflow:hidden}.shop{padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}.shop:hover{border-color:#b99c78;transform:translateY(-1px)}.shop-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:#eee3d0;font-size:27px}.shop h3,.food h3,.order h3{margin:0}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#f3e9d6;color:var(--brown);font-size:12px;font-weight:800}.food img,.food .placeholder{height:140px;width:100%;object-fit:cover;background:#e9ddc9;display:grid;place-items:center;font-size:52px}.food-body{padding:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.price{color:var(--green);font-weight:900;font-size:17px}.food-body p{font-size:13px}.food-body button{border:0;background:#e6bd72;border-radius:10px;padding:8px 12px;font-weight:850}.layout{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}.panel{padding:16px;position:sticky;top:12px}.line{padding:10px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;border-radius:7px;background:#efe4d2;width:26px;height:26px}.total{font-weight:900;font-size:20px;margin:14px 0}.order{padding:15px}.status{font-size:12px;font-weight:850;border-radius:99px;background:#f3e9d6;padding:4px 9px}.empty{padding:24px;text-align:center;border:1px dashed #cdbda9;border-radius:15px;color:var(--muted);background:#fffaf166}.overlay{position:fixed;inset:0;background:#20140fc9;display:grid;place-items:center;padding:16px;z-index:5}.modal{background:var(--cream);width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0004}.modal h2{margin:4px 0}.field{display:grid;gap:5px;margin:11px 0}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--dark)}.avatar-pick{display:flex;align-items:center;gap:12px}.avatar-pick img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--paper)}.hint{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:11px 16px;border-radius:12px;z-index:9}.hidden{display:none!important}.foot{text-align:center;color:var(--muted);font-size:12px;padding:28px 0 8px}@media(max-width:720px){.wrap{padding:13px}.hero{min-height:280px}.hero-copy{padding:22px}.hero:after{background:linear-gradient(0deg,#25160de8,#25160d30)}.layout{grid-template-columns:1fr}.panel{position:static}.head{align-items:start;flex-direction:column}.brand{font-size:17px}.brand img{width:42px;height:42px}.actions .btn{padding:9px 10px;font-size:13px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><img src="pacil-food-banner.jpg" alt="Pacil Food"><div>Pacil Food<small>Kantin kampus · pesan praktis</small></div></div>
      <div class="actions"><button id="installBtn" class="btn gold hidden" onclick="installApp()">⬇ Install</button><button id="profileChip" class="profile-chip" onclick="editProfile()"><img id="avatarSmall" alt=""><span id="nameSmall">Lengkapi profil</span></button></div>
    </header>
    <section class="hero"><img src="pacil-food-banner.jpg" alt="Suasana kantin Pacil Food"><div class="hero-copy"><div class="eyebrow">Kantin kampus, tanpa antre lama</div><h1>Pesan dulu,<br>ambil saat siap.</h1><p>Pilih menu favorit sebelum istirahat. Makanan disiapkan penjual, kamu tinggal datang dan ambil.</p><button class="btn gold" onclick="document.getElementById('content').scrollIntoView({behavior:'smooth'})">Lihat menu ↓</button></div></section>
    <nav class="nav"><button id="buyerTab" class="active" onclick="setMode('buyer')">🍽️ Pesan makanan</button><button id="ordersTab" onclick="setMode('orders')">📦 Pesanan saya</button><button id="sellerTab" onclick="setMode('seller')">🥘 Mode penjual</button></nav>
    <main id="content"></main><footer class="foot">Pacil Food · Pesan praktis, istirahat lebih santai ✨</footer>
  </div>
  <div id="overlay"></div><div id="toast"></div>
  <script>
    const DB='pacil-food-demo-v2',PROFILE='pacil-food-profile-v1',cash=n=>'Rp'+Number(n).toLocaleString('id-ID');
    let db=JSON.parse(localStorage.getItem(DB)||'null')||{shops:[{id:'warung',name:'Warung Bu Sari',category:'Masakan rumahan',emoji:'🍛',items:[{id:'pecel',name:'Nasi Pecel',price:12000,desc:'Sayur segar, bumbu kacang',emoji:'🥗'},{id:'geprek',name:'Ayam Geprek',price:16000,desc:'Pedasnya bisa request',emoji:'🍗'},{id:'teh',name:'Es Teh Manis',price:5000,desc:'Segar untuk teman makan',emoji:'🧋'}]},{id:'kopi',name:'Kopi Sudut',category:'Minuman & camilan',emoji:'☕',items:[{id:'kopi-susu',name:'Es Kopi Susu',price:14000,desc:'Kopi, susu, gula aren',emoji:'🥤'},{id:'roti',name:'Roti Bakar',price:10000,desc:'Cokelat dan keju',emoji:'🍞'}]}],orders:[]};
    let profile=JSON.parse(localStorage.getItem(PROFILE)||'null'),mode='buyer',selected=null,cart={},installPrompt;
    const save=()=>localStorage.setItem(DB,JSON.stringify(db)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function toast(t){let e=document.getElementById('toast');e.className='toast';e.textContent=t;setTimeout(()=>e.className='',2200)}
    function syncProfile(){document.getElementById('nameSmall').textContent=profile?profile.name:'Lengkapi profil';document.getElementById('avatarSmall').src=profile?.photo||'icon.svg'}
    function editProfile(){document.getElementById('overlay').innerHTML=`<div class="overlay"><form class="modal" onsubmit="saveProfile(event)"><div class="eyebrow" style="color:var(--brown)">${profile?'Profil Pacil Food':'Selamat datang di Pacil Food'}</div><h2>${profile?'Ubah profilmu':'Lengkapi profil dulu'}</h2><p class="muted">Supaya penjual tahu siapa yang memesan.</p><div class="field"><label>Nama</label><input id="pname" maxlength="50" required placeholder="Nama kamu" value="${esc(profile?.name||'')}"></div><div class="field"><label>Status</label><select id="prole" required><option value="">Pilih status</option>${['Mahasiswa','Dosen','Staff','Visitor / Pengunjung'].map(x=>`<option ${profile?.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Foto profil (opsional)</label><div class="avatar-pick"><img id="preview" src="${profile?.photo||'icon.svg'}" alt="Pratinjau foto"><input id="pfile" type="file" accept="image/*" onchange="previewPhoto(event)"></div><span class="hint">Maksimal 1 MB. Foto disimpan di browser ini.</span></div><button class="btn primary" style="width:100%">${profile?'Simpan profil':'Mulai pakai Pacil Food →'}</button>${profile?'<button type="button" class="btn light" style="width:100%;margin-top:8px" onclick="closeProfile()">Batal</button>':''}<p class="hint">Demo ini menyimpan profil di perangkat/browser yang sedang dipakai.</p></form></div>`}
    function closeProfile(){document.getElementById('overlay').innerHTML=''}
    function previewPhoto(e){let f=e.target.files[0];if(!f)return;if(f.size>1048576){toast('Foto maksimal 1 MB');e.target.value='';return}let r=new FileReader();r.onload=()=>document.getElementById('preview').src=r.result;r.readAsDataURL(f)}
    function saveProfile(e){e.preventDefault();let file=document.getElementById('pfile').files[0];const done=photo=>{profile={name:document.getElementById('pname').value.trim(),role:document.getElementById('prole').value,photo};localStorage.setItem(PROFILE,JSON.stringify(profile));syncProfile();closeProfile();toast('Profil tersimpan')};if(file){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)}else done(profile?.photo||'')}
    function setMode(m){mode=m;selected=null;cart={};document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(m==='buyer'?'buyerTab':m==='orders'?'ordersTab':'sellerTab').classList.add('active');render()}
    function render(){syncProfile();let a=document.getElementById('content');if(mode==='orders')return renderOrders(a);if(mode==='seller')return renderSeller(a);if(selected)return renderMenu(a);a.innerHTML=`<div class="head"><div><h2>Pilih warung favorit</h2><div class="muted">Menu kantin yang bisa dipesan sekarang.</div></div></div><div class="shops">${db.shops.map(s=>`<article class="shop" onclick="openShop('${s.id}')"><div class="shop-icon">${esc(s.emoji)}</div><div><h3>${esc(s.name)}</h3><span class="muted">${esc(s.category)}</span><br><span class="pill">Buka · siap menerima pesanan</span></div><b style="margin-left:auto">→</b></article>`).join('')}</div>`}
    function openShop(id){selected=id;cart={};render()}function findShop(){return db.shops.find(s=>s.id===selected)}
    function renderMenu(a){let s=findShop();if(!s){selected=null;return render()}let count=Object.values(cart).reduce((n,x)=>n+x,0),total=s.items.reduce((n,i)=>n+i.price*(cart[i.id]||0),0);a.innerHTML=`<div class="head"><div><button class="btn light" onclick="selected=null;render()">← Semua warung</button><h2 style="margin-top:10px">${esc(s.emoji)} ${esc(s.name)}</h2><div class="muted">${esc(s.category)}</div></div></div><div class="layout"><div class="foods">${s.items.map(i=>`<article class="food"><div class="placeholder">${esc(i.emoji||'🍜')}</div><div class="food-body"><div class="row"><h3>${esc(i.name)}</h3><span class="price">${cash(i.price)}</span></div><p class="muted">${esc(i.desc)}</p><div class="row"><span class="pill">Tersedia</span><button onclick="add('${i.id}')">+ Tambah</button></div></div></article>`).join('')}</div><aside class="panel"><h3>🧺 Keranjang (${count})</h3>${s.items.filter(i=>cart[i.id]).map(i=>`<div class="line"><div class="row"><b>${esc(i.name)}</b><span>${cash(i.price*cart[i.id])}</span></div><div class="row"><small>${cash(i.price)} / item</small><div class="qty"><button onclick="qty('${i.id}',-1)">−</button>${cart[i.id]}<button onclick="qty('${i.id}',1)">+</button></div></div></div>`).join('')||'<p class="muted">Pilih makanan untuk mulai pesan.</p>'}<div class="total row"><span>Total</span><span>${cash(total)}</span></div><button class="btn primary" style="width:100%" onclick="checkout()" ${count?'':'disabled'}>Pesan sekarang</button><small class="hint">Pembayaran dilakukan saat mengambil pesanan.</small></aside></div>`}
    function add(id){cart[id]=(cart[id]||0)+1;render();toast('Masuk keranjang')}function qty(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];render()}
    function checkout(){if(!profile)return editProfile();let s=findShop(),items=s.items.filter(i=>cart[i.id]).map(i=>({name:i.name,qty:cart[i.id],price:i.price})),total=items.reduce((n,i)=>n+i.qty*i.price,0);db.orders.unshift({id:'PF'+Date.now().toString().slice(-6),shop:s.name,buyer:profile.name,role:profile.role,items,total,status:'Pesanan baru',time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});save();selected=null;cart={};setMode('orders');toast('Pesanan berhasil dibuat')}
    function renderOrders(a){let list=db.orders.filter(o=>!profile||o.buyer===profile.name);a.innerHTML=`<div class="head"><div><h2>Pesanan saya</h2><div class="muted">Pantau status pesananmu di sini.</div></div></div>${list.length?`<div class="orders">${list.map(o=>`<article class="order"><div class="row"><div><h3>${esc(o.shop)}</h3><small class="muted">${esc(o.id)} · ${esc(o.time)}</small></div><span class="status">${esc(o.status)}</span></div><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</p><div class="row"><span class="muted">${o.status==='Siap diambil'?'Silakan ambil di warung':'Bayar saat ambil'}</span><b>${cash(o.total)}</b></div></article>`).join('')}</div>`:'<div class="empty">Belum ada pesanan. Pilih warung dan pesan menu favoritmu.</div>'}`}
    function renderSeller(a){a.innerHTML=`<div class="head"><div><h2>Ruang penjual</h2><div class="muted">Demo lokal untuk melihat pesanan pada browser ini.</div></div></div>${db.orders.length?`<div class="orders">${db.orders.map(o=>`<article class="order"><div class="row"><div><h3>${esc(o.buyer)} · ${esc(o.shop)}</h3><small class="muted">${esc(o.role||'')} · ${esc(o.id)}</small></div><select onchange="changeStatus('${o.id}',this.value)">${['Pesanan baru','Sedang disiapkan','Siap diambil'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</p><b>${cash(o.total)}</b></article>`).join('')}</div>`:'<div class="empty">Pesanan baru akan tampil di sini.</div>'}`}
    function changeStatus(id,v){let o=db.orders.find(x=>x.id===id);if(o){o.status=v;save();render();toast('Status pesanan diperbarui')}}
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').classList.remove('hidden')});async function installApp(){if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').classList.add('hidden')}
    window.addEventListener('appinstalled',()=>document.getElementById('installBtn').classList.add('hidden'));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
    render();if(!profile)editProfile();
  </script>
</body>
</html>
